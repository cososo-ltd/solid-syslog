# The Windows lanes' configure, shared by ci.yml's unit-windows-msvc and
# integration-windows-openssl. The msvc-* presets run vcpkg in manifest mode:
# the toolchain file installs what vcpkg.json lists, at the versions its
# builtin-baseline resolves, while CMake configures. One definition, so both
# lanes build against the same CppUTest and OpenSSL and share one cache.
#
# Runs on a GitHub-hosted Windows runner after the calling job has checked the
# tree out. Leaves VCPKG_ROOT and VCPKG_BINARY_SOURCES in the job's environment,
# so a later configure of another msvc-* preset in the same job restores the
# same packages from the archives rather than building them again.
name: vcpkg configure
description: Move the runner's vcpkg to the manifest's baseline, then configure an msvc-* preset with the built packages cached

inputs:
  preset:
    description: The msvc-* configure preset
    required: true

runs:
  using: composite
  steps:
    # vcpkg reads the baseline out of its own git history and the version
    # database out of its working tree, and fetches neither. The runner's
    # checkout is as old as the runner image, so a baseline newer than the image
    # fails the configure until the checkout holds it. Checking out the baseline
    # itself, and bootstrapping the vcpkg tool that commit names, makes the
    # ports, the scripts and the tool all the manifest's rather than the
    # image's.
    #
    # C:\vcpkg is VCPKG_INSTALLATION_ROOT on the GitHub-hosted Windows images.
    # It is written out here because the presets read VCPKG_ROOT, which the
    # image does not set.
    #
    # pwsh checks only the last native command's exit code, hence the explicit
    # checks.
    - name: Move vcpkg to the manifest's baseline
      shell: pwsh
      run: |
        $vcpkgRoot = 'C:\vcpkg'
        $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
        if (-not $baseline) { throw 'vcpkg.json has no builtin-baseline' }
        git -C $vcpkgRoot fetch --quiet origin $baseline
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git -C $vcpkgRoot checkout --quiet --detach $baseline
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $archives = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-archives'
        New-Item -ItemType Directory -Force $archives | Out-Null
        "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> $env:GITHUB_ENV

    # The built packages, as vcpkg's own binary archives. vcpkg keys each one by
    # an ABI hash covering the port, the compiler and the tools that built it,
    # and takes an archive only where that hash matches, so a restored cache can
    # never supply a stale binary: at worst it supplies nothing and the package
    # builds from source, which is about seven minutes for OpenSSL.
    #
    # The key has two parts. The manifest's hash starts a fresh cache whenever
    # the baseline or the dependency list moves. The archives' own hash, known
    # only after the configure, is what the save below adds; the restore matches
    # on the prefix and takes the most recent.
    #
    # The cache is a speed optimisation and must never decide the lane's result,
    # so neither step may fail the job: actions/cache can fail mid-restore even
    # after reporting a hit.
    - name: Restore the vcpkg binary archives
      id: archives
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: build/vcpkg-archives
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-

    - name: Configure
      shell: pwsh
      env:
        PRESET: ${{ inputs.preset }}
      run: cmake --preset $env:PRESET

    # Saved only when the configure wrote an archive the restore did not bring,
    # which is a cold cache or a runner image whose compiler or tools have
    # moved. A static key would restore the old archives for ever after such a
    # move and rebuild OpenSSL on every run. Archives from before the move stay
    # in the cache until the manifest next changes and the prefix starts again.
    - name: Save the vcpkg binary archives
      if: steps.archives.outputs.cache-matched-key != format('{0}-vcpkg-{1}-{2}', runner.os, hashFiles('vcpkg.json'), hashFiles('build/vcpkg-archives/**'))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: build/vcpkg-archives
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('build/vcpkg-archives/**') }}
