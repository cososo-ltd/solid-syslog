# Dependabot version updates — keeps CI and test tooling current.
# Security updates (vulnerability-driven bumps) are enabled separately in the
# repository's Security settings and do not need to be listed here.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions used by the CI, release-please, and SBOM workflows.
  # Actions are SHA-pinned; Dependabot bumps the SHA and refreshes the version
  # comment, reinforcing the action-pinning hardening posture.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # An action with several sub-actions is several dependencies to Dependabot
    # and one version to the workflow using them. CodeQL enforces that itself:
    # init stamps its version into the config file analyze then loads, and
    # analyze refuses a config another version wrote, so a PR bumping one of the
    # pair fails the required check every time. Grouping makes the bump one PR
    # holding both pins, which is also the only way the SHA pinning means what it
    # says — two halves of one action cannot drift apart.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Python packages used by the BDD test harness.
  - package-ecosystem: pip
    directory: /Bdd
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
