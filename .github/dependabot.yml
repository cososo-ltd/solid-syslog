# Dependabot version updates — keeps CI and test tooling current.
# Security updates (vulnerability-driven bumps) are enabled separately in the
# repository's Security settings and do not need to be listed here.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions used by the CI, release-please, and SBOM workflows.
  # Actions are SHA-pinned; Dependabot bumps the SHA and refreshes the version
  # comment, reinforcing the action-pinning hardening posture.
  #
  # `/` covers .github/workflows and nothing else, so a composite action that
  # pins an action of its own is listed by its directory or its pins never move.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/vcpkg-configure
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # An action with several sub-actions is several dependencies to Dependabot
    # and one version to the workflow using them. CodeQL enforces that itself:
    # init stamps its version into the config file analyze then loads, and
    # analyze refuses a config another version wrote, so a PR bumping one of the
    # pair fails the required check every time. Grouping makes the bump one PR
    # holding both pins, which is also the only way the SHA pinning means what it
    # says — two halves of one action cannot drift apart.
    #
    # actions/cache is grouped for the second reason alone: its restore and
    # save halves write and read one cache, and are pinned side by side in the
    # vcpkg-configure action.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      actions-cache:
        patterns:
          - "actions/cache*"

  # Python packages used by the BDD test harness.
  - package-ecosystem: pip
    directory: /Bdd
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  # CppUTest and OpenSSL on the Windows lanes, declared in vcpkg.json. A bump
  # moves `builtin-baseline` to the commit of vcpkg's newest release tag, so
  # it arrives when vcpkg tags a release rather than when a port changes, and
  # the baseline is kept on a tagged commit for Dependabot to recognise. It
  # moves every port the manifest lists at once; a port that has to be held
  # back takes an `overrides` entry in the manifest. When the bump moves
  # OpenSSL, the tested-against marker on the OpenSSL platform page has to
  # follow by hand before the docs lane passes.
  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
