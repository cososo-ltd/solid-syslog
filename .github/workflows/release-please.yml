name: Release Please

# Maintains the release pull request on every push to main, from the v0.1.0
# baseline onward. 0.1.0 itself was cut by hand: with no prior release, a
# generated changelog over all of main's history came to about 64,000 characters
# against GitHub's 65,536 pull-request body limit, so the first release was
# curated and this workflow picks up from the tag it left behind.
#
# workflow_dispatch is kept for running it by hand without waiting for a push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the GitHub Release
      pull-requests: write # to open and update the release PR
    steps:
      # A GitHub App token, not GITHUB_TOKEN. Two reasons. GITHUB_TOKEN cannot
      # open a pull request unless the repository allows Actions to create and
      # approve them, which grants approve repository-wide to every workflow.
      # And a pull request it opens has its checks held in an approval-required
      # state, so every release pull request and every update to one would wait
      # on someone pressing Approve workflows to run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
