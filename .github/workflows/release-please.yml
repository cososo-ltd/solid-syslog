name: Release Please

# Maintains the release pull request on every push to main, from the v0.1.0
# baseline onward. 0.1.0 itself was cut by hand: with no prior release, a
# generated changelog over all of main's history came to about 64,000 characters
# against GitHub's 65,536 pull-request body limit, so the first release was
# curated and this workflow picks up from the tag it left behind.
#
# workflow_dispatch is kept for running it by hand without waiting for a push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the GitHub Release
      pull-requests: write # to open and update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
