# Attaches the offline documentation bundle to a GitHub Release.
#
# The bundle is the documentation for a release that a reader can keep: extract
# the zip, open index.html, and read it with no server and no network. A live
# URL cannot be archived or verified after the fact; a signed file can, which is
# why this exists rather than a versioned copy of the site. See docs/release-process.md.
#
# The bundle is built and checked on every CI run too (the docs-build job in
# ci.yml), so the packaging path is exercised continuously. This workflow builds
# it again from the tag rather than reusing that artifact: a release asset should
# come from the released commit, not from whichever main build happened last.
# The coverage report the bundle carries is measured here from the tag for the
# same reason.
name: Documentation bundle

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  coverage:
    # The bundle carries the coverage report under its Testing pages, measured
    # from the same commit as the pages around it rather than taken from
    # whichever main build happened last. The same measurement as ci.yml's
    # unit-linux-gcc-coverage lane, in the same image, through the shared action.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/cososo-ltd/cpputest-freertos@sha256:c8c9038956fd2180f44fe75267d37499356e6bcd08ce5e4e5bcd44ad2e3206a6 # sha-9bd053e
      options: --user root
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure coverage and enforce the gate
        uses: ./.github/actions/coverage-report

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report-linux-gcc
          path: build/coverage/coverage_report/
          if-no-files-found: error
          retention-days: 1

  bundle:
    # Build and validate - shared by both triggers. Read-only; no secrets.
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Fetches the JUnit results of the CI run that tested this commit, below.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Where hooks/coverage_report.py and the Coverage page expect it; the
      # directory is git-ignored and copied into the bundle untouched.
      - name: Stage the coverage report for the Testing pages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report-linux-gcc
          path: docs/testing/coverage-report/

      - name: Read version from release-please manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The test report needs every lane's JUnit results, and nineteen lanes
      # cannot be re-run here. They come from the CI run that tested this very
      # commit on main, whose junit-* artifacts are kept a month for this
      # purpose (ci.yml). No successful run, or artifacts that have expired,
      # fails the bundle: a release does not ship without its evidence.
      - name: Fetch the JUnit results of the CI run that tested this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # The newest CI run for the commit, whatever state it is in. A release
          # is published by hand from a draft well after main went green, but
          # should one be published while that run is still going, wait for it
          # rather than report nothing: `gh run watch` returns the run's own
          # exit status, so a run that fails fails this step with it.
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
                     --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No CI run for $SHA, so there are no test results to report" >&2
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'junit-*' --dir build/junit
          test -n "$(ls -A build/junit)" || { echo "::error::Run $RUN_ID has no junit-* artifacts left to download" >&2; exit 1; }

      - name: Generate the test report for the Testing pages
        env:
          SOLIDSYSLOG_DOCS_RELEASE: ${{ github.event_name == 'release' && steps.version.outputs.version || '' }}
          SOLIDSYSLOG_DOCS_ORIGIN: ${{ github.ref_name }}
          SOLIDSYSLOG_DOCS_COMMIT: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.release.tag_name || github.sha }}/
        run: python3 scripts/junit_report_pages.py build/junit docs/testing/test-report --source-url "$SOURCE_URL"

      # SOLIDSYSLOG_DOCS_RELEASE makes the footer read "Documentation for release
      # X" rather than naming a branch and commit: this build is the release, so
      # the commit belongs in MANIFEST.txt beside the pages, not in every footer.
      # It is set on the release event only. A dispatched build is not a release,
      # so its footer names the branch and commit it was built from instead.
      #
      # SOLIDSYSLOG_DOCS_REF pins the links hooks/source_links.py writes for any
      # file outside docs/. It defaults to main, which is right for the published
      # site because that site is rebuilt from main on every push - but wrong
      # here. This bundle is frozen at a release and kept, so a link to main
      # drifts away from the pages around it and eventually names a file that has
      # moved or gone. The tag holds. No page emits such a link today; pinning it
      # now means the first one that does is already correct.
      # Image digest below is mkdocs-mkdoxy sha-34173c0 (see docs/containers.md).
      - name: Build the offline documentation bundle
        env:
          SOLIDSYSLOG_DOCS_IMAGE: ghcr.io/cososo-ltd/mkdocs-mkdoxy@sha256:9ab3d41807a941f3d5a7077fb7288d0ffe2a926729ce13a4fc889cc8b6630d43
          SOLIDSYSLOG_DOCS_VERSION: ${{ steps.version.outputs.version }}
          SOLIDSYSLOG_DOCS_RELEASE: ${{ github.event_name == 'release' && steps.version.outputs.version || '' }}
          SOLIDSYSLOG_DOCS_ORIGIN: ${{ github.ref_name }}
          SOLIDSYSLOG_DOCS_COMMIT: ${{ github.sha }}
          SOLIDSYSLOG_DOCS_REF: ${{ github.event.release.tag_name || github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          docker run --rm -v "$PWD:/docs" \
            -e SOLIDSYSLOG_DOCS_IMAGE \
            -e SOLIDSYSLOG_DOCS_VERSION \
            -e SOLIDSYSLOG_DOCS_RELEASE \
            -e SOLIDSYSLOG_DOCS_ORIGIN \
            -e SOLIDSYSLOG_DOCS_COMMIT \
            -e SOLIDSYSLOG_DOCS_REF \
            -e RELEASE_TAG \
            "$SOLIDSYSLOG_DOCS_IMAGE" \
            sh -c 'mkdocs build -f /docs/mkdocs-offline.yml -d /docs/build/bundle --strict \
                   && python3 /docs/scripts/make_offline_bundle.py /docs/build/bundle \
                        "/docs/build/solid-syslog-docs-$SOLIDSYSLOG_DOCS_VERSION.zip" \
                        --version "$SOLIDSYSLOG_DOCS_VERSION" \
                        --commit "$SOLIDSYSLOG_DOCS_COMMIT" \
                        --tag "${RELEASE_TAG:-v$SOLIDSYSLOG_DOCS_VERSION}"'

      - name: Check the bundle works with no server and no network
        run: python3 scripts/check_offline_bundle.py build/bundle

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-offline-bundle-${{ steps.version.outputs.version }}
          path: build/solid-syslog-docs-*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    # Release-only: keyless-sign the bundle and attach it with its signature.
    #
    # Every step hard-fails, for the reason the SBOM workflow gives: the Release
    # already exists by the time this runs, so swallowing a failure would publish
    # a Release missing an asset while reporting success.
    if: github.event_name == 'release'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download bundle workflow artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-offline-bundle-${{ needs.bundle.outputs.version }}
          path: bundle/

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.0.6'

      # The .sigstore suffix is load-bearing, not cosmetic: signature-detecting
      # tooling matches on it, so a bundle named .bundle reads as an unsigned
      # release asset. Change it only to another recognised suffix.
      - name: Sign the bundle (keyless, GitHub OIDC)
        env:
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          cosign sign-blob --yes \
            --bundle "bundle/solid-syslog-docs-$VERSION.zip.sigstore" \
            "bundle/solid-syslog-docs-$VERSION.zip"

      - name: Attach assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # --repo is required here: this job doesn't check out the source, so
          # `gh` has no git config to infer the repo from.
          gh release upload "$TAG" \
            "bundle/solid-syslog-docs-$VERSION.zip" \
            "bundle/solid-syslog-docs-$VERSION.zip.sigstore" \
            --clobber \
            --repo "${{ github.repository }}"
