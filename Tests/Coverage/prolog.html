<!DOCTYPE html>
<!--
  genhtml's HTML prolog for the coverage report the documentation site
  publishes under its Testing pages. genhtml substitutes @pagetitle@ and
  @basedir@, the relative path back to the report's root with its trailing
  slash, which is what lets one prolog serve pages at every depth. gcov.css is
  genhtml's own stylesheet; solidsyslog.css overrides what it needs to, and
  Tests/CMakeLists.txt copies it and the cube mark into the report beside it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@pagetitle@</title>
  <link rel="icon" href="@basedir@solidsyslog-cube.svg">
  <link rel="stylesheet" type="text/css" href="@basedir@gcov.css">
  <link rel="stylesheet" type="text/css" href="@basedir@solidsyslog.css">
</head>
<body>
  <header class="ss-header">
    <a class="ss-header__brand" href="@basedir@index.html">
      <img class="ss-header__mark" src="@basedir@solidsyslog-cube.svg" alt="" width="32" height="32">
      <span class="ss-header__name">SolidSyslog</span>
    </a>
    <span class="ss-header__section">Coverage</span>
  </header>
