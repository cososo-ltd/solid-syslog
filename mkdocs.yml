# Documentation site build. The toolchain (Doxygen + MkDocs + Material + mkdoxy)
# ships as the ghcr.io/cososo-ltd/mkdocs-mkdoxy image — see docs/containers.md.
# The API reference under api/ is generated from Core/Interface/*.h by mkdoxy at
# build time and is git-ignored.
site_name: SolidSyslog
site_description: Structured syslog for embedded and industrial systems
site_url: https://docs.cososo.co.uk/solid-syslog/
repo_url: https://github.com/cososo-ltd/solid-syslog
repo_name: cososo-ltd/solid-syslog
edit_uri: edit/main/docs/
copyright: © Cozens Software Solutions Limited

extra_css:
  - assets/stylesheets/brand.css

extra_javascript:
  # Shrinks the header logo on scroll (1.0 -> 0.755) to match cososo.co.uk.
  - javascripts/logo-scroll.js

extra:
  # The corporate logo and site title link here (cososo.co.uk homepage).
  homepage: https://www.cososo.co.uk

theme:
  name: material
  custom_dir: overrides
  # Header: corporate CoSoSo logo (→ homepage). Favicon: the SolidSyslog cube —
  # the browser tab represents the product, so it carries the product mark.
  logo: assets/images/cososo-logo.svg
  favicon: assets/images/solidsyslog-cube.svg
  # Match cososo.co.uk: Open Sans body, Montserrat headings (headings set in
  # assets/stylesheets/brand.css). The site accent #3e2199 is set there too.
  font:
    text: Open Sans
  palette:
    # cososo.co.uk is white/light only, so the docs are light only too — one
    # clean scheme, no dark toggle, so it always matches the website. primary:
    # white gives a white header with dark text and correctly styled search/icons.
    - scheme: default
      primary: white
      accent: deep purple
  features:
    # Top-level sections become a horizontal nav bar (closer to the website's
    # menu than the mobile hamburger); sub-pages stay in the left sidebar.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - toc.follow
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible slug function so in-page anchors match the ones the
      # same Markdown produces on GitHub (keeps cross-doc #anchors resolving).
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

# Build-time hook: repo-source links (../Core/…, ../Platform/…, ../SECURITY.md)
# stay relative in the Markdown so they resolve on GitHub, in a clone, in a
# fork, and in the IDE. hooks/source_links.py rewrites any link that resolves
# outside docs/ to a canonical {repo_url}/blob|tree/{ref}/… URL at build time,
# before MkDocs validates links. Pin the ref per build with SOLIDSYSLOG_DOCS_REF
# (a release tag or commit SHA); it defaults to main.
hooks:
  # Publishes the repository-root documents the site should hold rather than
  # link away to — SECURITY.md and friends stay at the root because GitHub
  # looks for them there, and are rendered here from that same source.
  - hooks/root_pages.py
  - hooks/source_links.py
  # Injects post-it "realised by" relationship diagrams at the top of selected
  # generated API pages (experiment — see hooks/relationship_diagrams.py).
  - hooks/relationship_diagrams.py
  # Hides the one-entry table of contents on the generated Functions / Macros
  # indexes, whose letter buckets collapse under the common SolidSyslog prefix.
  - hooks/api_index_toc.py
  # Drops mkdoxy's member summary tables, which list every member a second time
  # above the Documentation section that carries it in full — and render a
  # function-pointer member's type as the bare text "void(*".
  - hooks/api_member_summaries.py
  # Drops the Doxygen kind mkdoxy puts in front of every member heading, and so
  # from the table of contents built from them. Each heading keeps the anchor it
  # had, because links point at those from outside the site as well as inside.
  - hooks/api_member_headings.py
  # Puts a "Part of the <Platform> platform" banner on every generated API page
  # for a header under Platform/<Pack>/, linking to that pack's own page. The
  # pack list comes from SOLIDSYSLOG_PLATFORM_REGISTRY, so registering a new
  # platform is all it takes.
  - hooks/platform_backlinks.py
  # Gives each hand-written page its own <meta name="description">, the snippet
  # a search result shows, instead of the site_description above. The map lives
  # in the hook rather than in front matter because the same Markdown is read on
  # GitHub, which renders front matter as a table; the hook fails the build if
  # the map and the nav disagree.
  - hooks/page_descriptions.py

# not_found — enforced (fatal under --strict): the hook above resolves every
#             in-repo source link, so a genuinely broken link fails the build.
# anchors   — enforced too. It was held at info for anchors like #enum-@0 that
#             mkdoxy was said to emit and fail on; the generated pages no
#             longer link to any, and a link into a heading that has moved is
#             exactly the breakage a build should refuse.
# Everything else keeps its default: nav typos (validation.nav.*) and
# unrecognized links still fail a strict build.
validation:
  links:
    not_found: warn
    anchors: warn

plugins:
  - search
  # Renders GitHub alert blocks ( > [!NOTE] / [!WARNING] ) as Material
  # admonitions, so the same source renders natively on GitHub and in the site.
  - gh-admonitions
  - mkdoxy:
      projects:
        api:
          # Platform is swept whole rather than listed pack by pack, so a new
          # platform's headers and its group file are picked up by existing
          # there. EXCLUDE_PATTERNS below keeps the private Source/ headers out.
          src-dirs: "Core/Interface Platform"
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            RECURSIVE: true
            # Platform/<Pack>/Source/ holds the *Private.h / *Internal.h
            # headers, which are implementation detail and not public API.
            EXCLUDE_PATTERNS: "*/Source/*"
            # No verbatim source listings in the reference. The docs describe the
            # contract; the code is read in the repository, and the two example
            # repositories are where working code is shown. Without this, every
            # file page carries a "Go to the source code of this file" link to a
            # generated copy of the header.
            XML_PROGRAMLISTING: false
            VERBATIM_HEADERS: false
            EXTRACT_ALL: true
            OPTIMIZE_OUTPUT_FOR_C: true
            # First sentence of each /** */ block becomes the API-index brief.
            JAVADOC_AUTOBRIEF: true
            # Custom command: @optional tags a config member the caller may leave
            # NULL. Doubles as the machine-readable marker the relationship-diagram
            # hook reads to draw a 0.. lower bound (see hooks/relationship_data.py).
            ALIASES: '"optional=**Optional:** "'
            # Expand the C-linkage guard macros to nothing so Doxygen sees plain
            # file-scope C declarations. Without this the unexpanded
            # SOLIDSYSLOG_EXTERN_C_BEGIN token gets glued onto the first declaration
            # in each header (e.g. SolidSyslogSsize's type rendered as
            # "SOLIDSYSLOG_EXTERN_C_BEGIN typedef intptr_t").
            # EXPAND_ONLY_PREDEF keeps every other macro (the SOLIDSYSLOG_* constants)
            # documented by name rather than expanded to its value.
            MACRO_EXPANSION: true
            EXPAND_ONLY_PREDEF: true
            PREDEFINED: "SOLIDSYSLOG_EXTERN_C_BEGIN= SOLIDSYSLOG_EXTERN_C_END="
            # The guards are internal C-linkage plumbing from
            # Core/Interface/SolidSyslogExternC.h, not integrator-facing API.
            # PREDEFINED above only stops them corrupting the declarations; this keeps
            # them out of the public macro index as well.
            EXCLUDE_SYMBOLS: "SOLIDSYSLOG_EXTERN_C_*"

nav:
  - Home: README.md
  # Published from SUPPORT.md at the repository root by hooks/root_pages.py.
  - Support: support.md
  # Core is the product: the portable library everything else exists to serve.
  # It sits at the top level beside Platforms, which is the convenience layer,
  # rather than below the generated indexes inside API reference — the nav said
  # the opposite of the product for as long as it did. One child, so
  # navigation.indexes promotes it into the tab link.
  - Core:
      - core/index.md
  - Integrate:
      - Building up the protection you need: hardening-path.md
      - Adding it to your build: build-integration.md
      - Structured data: structured-data.md
      - TLS obligations: tls.md
      - Error handling: error-severity.md
  # Platforms answers "will this run on my target" — an integration question, not
  # a reference one, so it is a tab rather than a child of API reference. Porting
  # sits directly beneath the overview as the other half of it: nothing shipped
  # fits, so write one. The packs themselves are then a flat alphabetical list,
  # which is how a sidebar gets used — to look one up. Each pack's setup guide is
  # deliberately absent here and reached from the pack's own page instead: the
  # two have different audiences, and a nested pair per pack made the sidebar
  # unreadable.
  - Platforms:
      - platforms/index.md
      - Port a new platform: porting.md
      - C11 atomics: platforms/stdatomic/index.md
      - FatFs: platforms/fatfs/index.md
      - FreeRTOS: platforms/freertos/index.md
      - FreeRTOS-Plus-FAT: platforms/plusfat/index.md
      - FreeRTOS-Plus-TCP: platforms/plustcp/index.md
      - lwIP (Raw API): platforms/lwipraw/index.md
      - Mbed TLS: platforms/mbedtls/index.md
      - OpenSSL: platforms/openssl/index.md
      - Posix: platforms/posix/index.md
      - Windows: platforms/windows/index.md
  - Compliance:
      # The one-screen orientation on both frameworks, so it leads the section
      # the frameworks are in rather than sitting alone under a tab called
      # Overview, where its own title contradicted the label above it.
      - Compliance in one page: overview.md
      - CRA guide: cra.md
      - IEC 62443 guide: iec62443.md
      - RFC matrix: rfc-compliance.md
      - Threat model: security/threat-model.md
      - At-rest cryptography: security/at-rest-cryptography.md
      - SBOM: security/sbom.md
      - Vulnerability triage: security/triage-runbook.md
      - Release verification: security/release-verification.md
      # Published from SECURITY.md at the repository root by hooks/root_pages.py.
      - Security policy: security/policy.md
      # Likewise LICENSE.md — the terms are a compliance question for a reader
      # deciding whether they may use the library.
      - Licence: license.md
  - API reference:
      # api-reference/index.md is the tab's own first child, so navigation.indexes
      # promotes it into the tab link — and the narrow-width drawer opens on this
      # landing at the tab level, where Headers and Symbols / Roles are its
      # siblings. Nesting it inside a same-named section (as before) made the
      # drawer open one level deeper, hiding those doorways behind the back arrow.
      - api-reference/index.md
      # The raw Doxygen indexes as one peer section beside Roles; labelled
      # distinctly (not "API reference") so it doesn't shadow the tab name.
      - Headers and Symbols:
          - Headers: api/files.md
          - Data structures: api/annotated.md
          - Functions: api/functions.md
          - Macros: api/macros.md
      # A role *is* its vtable, so each entry links straight to the generated
      # contract page; detail belongs in the SolidSyslog<Role>Definition.h
      # doc comment, not a hand-maintained copy here.
      - Roles:
          - roles/index.md
          - Resolver: api/structSolidSyslogResolver.md
          - Datagram: api/structSolidSyslogDatagram.md
          - Stream: api/structSolidSyslogStream.md
          - Sender: api/structSolidSyslogSender.md
          - Buffer: api/structSolidSyslogBuffer.md
          - Store: api/structSolidSyslogStore.md
          - BlockDevice: api/structSolidSyslogBlockDevice.md
          - File: api/structSolidSyslogFile.md
          - Mutex: api/structSolidSyslogMutex.md
          - AtomicCounter: api/structSolidSyslogAtomicCounter.md
          - StructuredData: api/structSolidSyslogStructuredData.md
          - SecurityPolicy: api/structSolidSyslogSecurityPolicy.md
  - Maintaining:
      - Building & testing: builds.md
      - Local checks: local-checks.md
      - BDD testing: bdd.md
      - CI pipeline: ci.md
      - Container images: containers.md
      - Naming conventions: NAMING.md
      - MISRA deviations: misra-deviations.md
      - Release process: release-process.md
